stages:
  extract:
    cmd: python src/extract_data.py
    deps:
      - src/extract_data.py
    outs:
      - data/raw_loans.csv
  validate_data:
    cmd: great_expectations checkpoint run validation_checkpoint
    deps:
      - data/raw_loans.csv
  prepare_feature_store:
    cmd: python src/feature_engineering.py
    deps:
      - data/raw_loans.csv
      - src/feature_engineering.py
    outs:
      - data/feature_store.parquet
  train:
    cmd: python src/train_lgb.py
    deps:
      - data/feature_store.parquet
      - src/train_lgb.py
    params:
      - params.yaml:
        - learning_rate
    outs:
      - models/model.pkl
