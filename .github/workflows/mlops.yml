name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install -r ml_service/requirements.txt pytest
        
      - name: Run Model Unit Tests
        run: pytest ml_service/tests/
        
      - name: Build and Push Docker Image
        run: |
          docker build -t backend-inference:latest ./ml_service
          # docker tag backend-inference:latest myregistry/backend-inference:${{ github.sha }}
          # docker push myregistry/backend-inference:${{ github.sha }}
